name: CI

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run deps   # build the smaltdb 0.9 packages pinned in packed.json (not on npm yet) and vendor them
      - run: npm run typecheck
      - name: brand/ matches stenhoor/smalt-brand at its pinned commit
        run: node scripts/sync-brand.mjs --check
      - run: scripts/install-chromium.sh   # retries the system packages, then installs Chromium without them
      - run: npm test
