name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smaltdb_version:
        description: 'Deploy with this smaltdb npm version (e.g. 0.9.0 or latest). Empty = the version pinned in package-lock.json.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci   # postinstall copies node_modules/smaltdb/dist into vendor/smaltdb
      - name: Use another smaltdb version
        if: ${{ inputs.smaltdb_version != '' }}
        run: |
          npm install --no-save "smaltdb@${{ inputs.smaltdb_version }}"
          npm run vendor   # re-copy the engine: vendor/ was filled from the pinned version by npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    # A green deploy does not prove the site works (smaltui#7): load it in a browser and check the demo runs.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node test/smoke.mjs "${{ needs.deploy.outputs.page_url }}"
